<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4e79">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khảo sát Solar">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Khảo Sát Solar BM01</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Layout: app di động một cột — danh sách hồ sơ ↔ form theo mục I–VI, thanh mục dính trên, thanh lưu/xuất dính dưới */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --ink:#14283a; --muted:#5d6b78; --line:#dde3e6;
  --navy:#1f4e79; --sun:#f0a020; --sun-ink:#5a3a00; --sun-soft:#fff3dc;
  --ok:#1e7a4c; --ok-soft:#e3f4ea; --warn:#b4561b; --bad:#b3261e; --bad-soft:#fde7e5;
  --chip:#eef2f5; --chip-on:#1f4e79; --chip-on-ink:#fff;
  --f-display:"Archivo","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1820; --surface:#16222d; --ink:#e6edf2; --muted:#9aabb8; --line:#26384a;
  --navy:#7fb2e5; --sun:#f5b23c; --sun-ink:#2a1a00; --sun-soft:#3a2c12;
  --ok:#5cc58e; --ok-soft:#173326; --warn:#f0a066; --bad:#ff8a80; --bad-soft:#3d1f1d;
  --chip:#1e2e3c; --chip-on:#7fb2e5; --chip-on-ink:#0f1820; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1820; --surface:#16222d; --ink:#e6edf2; --muted:#9aabb8; --line:#26384a;
  --navy:#7fb2e5; --sun:#f5b23c; --sun-ink:#2a1a00; --sun-soft:#3a2c12;
  --ok:#5cc58e; --ok-soft:#173326; --warn:#f0a066; --bad:#ff8a80; --bad-soft:#3d1f1d;
  --chip:#1e2e3c; --chip-on:#7fb2e5; --chip-on-ink:#0f1820; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding-block:18px 10px}
.top .brand{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.top h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.sunmark{width:36px;height:36px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.navy{background:var(--navy);border-color:var(--navy);color:var(--chip-on-ink)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.note{font-size:13px;color:var(--muted)}
.banner{border-radius:var(--r);padding:10px 12px;font-size:13px;margin-block:8px;background:var(--sun-soft);color:var(--ink)}
.banner.bad{background:var(--bad-soft)}

/* Danh sách */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-block:8px 14px}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px;font:inherit;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:4px 14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;width:100%}
.card .code{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.card .name{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.card .meta{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap}
.ring{grid-row:1/3;grid-column:2;align-self:center;width:46px;height:46px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center}
.empty h2{font-size:18px;margin-bottom:6px}
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
table.sum{border-collapse:collapse;font-size:13px;min-width:900px;width:100%}
table.sum th,table.sum td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.sum th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--chip);position:sticky;top:0}
table.sum td.num{text-align:right;font-variant-numeric:tabular-nums}
table.sum tr{cursor:pointer}
table.sum tbody tr:hover{background:var(--chip)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.seg button{border:0;background:var(--surface);padding:8px 12px;font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--chip-on-ink)}

/* Form */
.formhead{display:flex;align-items:flex-start;gap:10px;padding-block:14px 6px}
.formhead .t{flex:1;min-width:0}
.formhead h1{font-size:20px;overflow-wrap:anywhere}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:6px;overflow-x:auto;padding-block:8px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{text-decoration:none;color:var(--ink);cursor:pointer;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.tab .cnt{font-size:11px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.tab.full{border-color:var(--ok)}
.tab.full .cnt{color:var(--ok)}
section.sec{margin-top:18px;scroll-margin-top:64px}
.sechead{display:flex;align-items:baseline;gap:10px;padding-block:6px 10px;border-bottom:2px solid var(--navy);margin-bottom:6px}
.sechead .roman{font-family:var(--f-display);font-weight:800;font-size:20px;color:var(--navy);min-width:34px}
.sechead h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.item{display:grid;grid-template-columns:40px 1fr;gap:6px 10px;padding-block:12px;border-bottom:1px solid var(--line)}
.item.sub{padding-left:24px}
.num{font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--navy);background:var(--chip);border-radius:8px;height:30px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.item.filled .num{background:var(--navy);color:var(--chip-on-ink)}
.ibody{min-width:0;display:flex;flex-direction:column;gap:8px}
.lbl{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.lbl .req{color:var(--bad)}
.row{display:flex;gap:8px;align-items:stretch}
.field{flex:1;min-width:0;position:relative}
.field input,.field textarea,.other input{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 11px;font:inherit}
.field textarea{min-height:72px;resize:vertical}
.field .unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}
.field input.hasunit{padding-right:46px}
.cam{flex:none;width:44px;border:1px solid var(--line);background:var(--surface);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--navy);position:relative}
.cam svg{width:20px;height:20px}
.cam .badge{position:absolute;top:-6px;right:-6px;background:var(--sun);color:var(--sun-ink);font-size:11px;font-weight:700;border-radius:999px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding-inline:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chipbtn{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.chipbtn[aria-pressed="true"]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-ink)}
.chipbtn .box{width:14px;height:14px;border:1.5px solid currentColor;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;line-height:1}
.other{margin-top:2px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:84px;border-radius:8px;overflow:hidden;border:1px solid var(--line);background:var(--chip)}
.thumb img{display:block;width:84px;height:84px;object-fit:cover}
.thumb .cap{font-size:10px;padding:2px 5px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thumb .x{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:13px;line-height:22px}
.thumb .st{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:11px;text-align:center;padding:4px}
.slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.slot{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.slot.wide{grid-column:1/-1}
.slot .sh{font-size:12px;font-weight:600;padding:7px 10px;border-bottom:1px solid var(--line);display:flex;gap:6px}
.slot .sh b{color:var(--navy);font-family:var(--f-display)}
.slot .sb{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;position:relative;background:var(--chip);border:0;width:100%;padding:0}
.slot.wide .sb{aspect-ratio:2/1}
.slot .sb img{width:100%;height:100%;object-fit:contain;background:#000}
.slot .sb .ph{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:12px}
.slot .sb .ph svg{width:26px;height:26px}
.slot .acts{display:flex;justify-content:flex-end;gap:4px;padding:4px}
.sigs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:8px}
.sigbox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.sigbox h3{font-size:13px;text-transform:uppercase;letter-spacing:.05em}
.sigpad{width:100%;height:140px;border:1px dashed var(--line);border-radius:8px;background:#fff;touch-action:none;display:block}
.sigimg{width:100%;height:140px;object-fit:contain;background:#fff;border-radius:8px;border:1px solid var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar .status{flex:1;min-width:0;font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px}
.dot{width:8px;height:8px;border-radius:999px;background:var(--ok);flex:none}
.dot.saving{background:var(--sun)}
.dot.err{background:var(--bad)}
.prog{height:4px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:var(--sun)}
.confirm{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:30;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top,0px)) 12px calc(12px + env(safe-area-inset-bottom,0px))}
.viewer img{flex:1;min-height:0;object-fit:contain;width:100%}
.viewer .vbar{display:flex;gap:8px;align-items:center;color:#fff;padding-block:8px}
.viewer .vbar input{flex:1;min-width:0;border-radius:8px;border:1px solid #555;background:#222;color:#fff;padding:8px 10px;font:inherit}
.viewer .vbar .btn{background:#222;color:#fff;border-color:#555}
@media (max-width:480px){.slots,.sigs{grid-template-columns:1fr}.stats b{font-size:18px}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.tag{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--sun-soft);color:var(--ink);border-radius:999px;padding:1px 7px}
.item.auto .field input{background:var(--sun-soft)}
.item.auto.ov .field input{background:var(--surface);border-color:var(--navy)}
.tag.edit{border:0;cursor:pointer;background:var(--navy);color:var(--chip-on-ink);font-family:inherit}
.sysrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.maplink{font-size:13px;color:var(--navy);font-weight:600}
.cam.busy{opacity:.5}
.modebox{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-block:8px 4px;display:flex;flex-direction:column;gap:8px}
.seg.wide{display:flex;width:100%}
.seg.wide button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px 8px}
.radio{width:14px;height:14px;border-radius:999px;border:2px solid currentColor;display:inline-block;flex:none}
.seg button[aria-pressed="true"] .radio{background:radial-gradient(circle,currentColor 0 3px,transparent 4px)}
.calcbox{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:8px}
.steps{margin:0;padding-left:20px;font-size:13px;display:flex;flex-direction:column;gap:4px;font-variant-numeric:tabular-nums}
.warn{margin:0;font-size:13px;color:var(--warn);font-weight:600}
details summary{cursor:pointer;font-weight:600;font-size:13px;color:var(--navy);padding-block:4px}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-block:8px}
.pf{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;min-width:0}
.pf small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.sigok{color:var(--ok)!important;font-weight:600}
.slotst{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font-size:12px}
.banner.off{background:var(--bad-soft)}
@media (max-width:480px){.pgrid{grid-template-columns:1fr}.bar .btn{padding:9px 11px}}
</style>

</head><body>
<div class="wrap" id="app"></div>
<input type="file" id="filePick" accept="image/*" capture="environment" hidden>
<script src="js/data.js"></script>
<script src="js/fields.js"></script>
<script src="js/calc.js"></script>
<script src="js/export.js"></script>
<script src="js/pdf.js"></script>
<script src="js/store-local.js"></script>
<script src="js/app.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body></html>
